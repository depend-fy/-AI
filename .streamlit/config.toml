# Streamlit 外观配置（主题色与首页行为）
# 目的：让 Demo 的观感统一、专业；观感属于"展示层"，不影响任何业务逻辑。

[theme]
base = "light"
primaryColor = "#1f5fa9"          # 主色：沉稳的蓝，符合"校验/审计"的气质
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1c1f23"
font = "sans serif"

[server]
headless = false                   # 本地运行时自动打开浏览器
# 改代码后**不**自动重载。原因：自动重载在文件处于"改了一半"的状态时会拉到语法错误，
# 严重时会让整个服务进程退出（开发期实测遇到过）。手动重载更可控：
# 浏览器里按 R，或点右上角 Rerun。
runOnSave = false

[browser]
gatherUsageStats = false           # 不上报使用统计，符合数据隐私要求

[client]
showErrorDetails = true            # 开发期保留完整报错，便于定位问题
toolbarMode = "minimal"
